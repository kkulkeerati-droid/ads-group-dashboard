# กันหลับ + เติม cache สด: ยิง /api/sync ทุก 2 ชม.
# - Supabase free จะ pause ถ้าไม่มี activity ~7 วัน → job นี้ทำให้ไม่หลับอีก
# - ทุกรอบ sync ย้อนหลัง SYNC_DAYS วัน → ตัวเลข 7/30 วันสดสุด ~2 ชม.
name: keepalive-sync
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/sync
        run: curl -sf --max-time 115 "https://dashboard-ads-thanatos.vercel.app/api/sync?key=${{ secrets.CRON_SECRET }}" || echo "sync failed (non-fatal)"
