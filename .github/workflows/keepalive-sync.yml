# กันหลับ + เติม cache สด: ยิง /api/sync ทุก 2 ชม.
# - Supabase free จะ pause ถ้าไม่มี activity ~7 วัน → job นี้ทำให้ไม่หลับอีก
# - ทุกรอบ sync ย้อนหลัง SYNC_DAYS วัน → ตัวเลข 7/30 วันสดสุด ~2 ชม.
# - ตั้งแต่ 11 ส.ค. 69: /api/sync จะ prune แถวค้างให้ด้วย (แอดที่ถูกลบ Meta ไม่คืนมาแล้ว
#   upsert อย่างเดียวไม่มีวันลบมันออก แถวเก่าบวกเข้ายอดรวมตลอดไป)
name: keepalive-sync
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "backfill ตั้งแต่ (YYYY-MM-DD) — เว้นว่าง = ใช้ SYNC_DAYS ปกติ"
        required: false
      until:
        description: "backfill ถึง (YYYY-MM-DD)"
        required: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/sync
        run: |
          # 3 ต.ค. 2026: ช่วงปกติ (SYNC_DAYS ราว 4 วัน) เกินเพดาน 60 วิของ /api/sync จนได้ 504 เกือบทุกรอบ
          # (25 ก.ย.–3 ต.ค. ผ่านแค่ 4 จาก 30 รอบ แต่ workflow ขึ้นเขียวตลอด) → แบ่งยิงทีละ 2 วัน ซึ่งวัดแล้วผ่าน 200
          sync() {
            # เก็บ body ไว้อ่าน — เดิม -sf กลืนทั้ง status และ body ทำให้ sync พังแบบเงียบ ๆ ได้
            # body เป็น JSON ที่เราสร้างเอง ไม่มี key/token อยู่ในนั้น (error ถูก redact ที่ lib/meta.ts แล้ว)
            code=$(curl -s -o /tmp/sync.json -w '%{http_code}' --max-time 115 \
              "https://dashboard-ads-thanatos.vercel.app/api/sync?key=${{ secrets.CRON_SECRET }}&since=$1&until=$2") || code=000
            echo "[$1 → $2] HTTP $code"
            head -c 600 /tmp/sync.json || true
            echo
            [ "$code" = "200" ]
          }
          if [ -n "${{ inputs.since }}" ]; then
            sync "${{ inputs.since }}" "${{ inputs.until }}" || { echo "⚠️ backfill ไม่สำเร็จ — ลองช่วงสั้นลง (≤2 วัน)"; exit 1; }
            exit 0
          fi
          ok=0
          sync "$(date -u -d '1 day ago' +%F)" "$(date -u +%F)" && ok=$((ok+1))
          sync "$(date -u -d '3 days ago' +%F)" "$(date -u -d '2 days ago' +%F)" && ok=$((ok+1))
          echo "ผ่าน $ok/2 ช่วง"
          # ล้มทั้ง 2 ช่วง = ให้ workflow เป็นสีแดง (GitHub ส่งอีเมลเตือน) แทนที่จะเงียบแบบเดิม
          [ "$ok" -gt 0 ] || { echo "⚠️ sync ล้มทั้งหมด"; exit 1; }
