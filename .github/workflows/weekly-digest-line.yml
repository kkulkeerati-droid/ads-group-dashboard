# ส่ง Weekly Digest เข้า LINE ทุกวันจันทร์เช้า
# - cron ของ GitHub เป็น UTC → 01:00 UTC = 08:00 น. ไทย
# - สรุปของ "สัปดาห์ที่เพิ่งจบ" (7 วันล่าสุดนับถึงเมื่อวาน = อา.) เทียบกับ 7 วันก่อนหน้า
# - ต้องตั้ง secret: CRON_SECRET  ·  ต้องตั้ง env บน Vercel: LINE_CHANNEL_ACCESS_TOKEN, LINE_TO
# - กดรันเองได้จากแท็บ Actions (workflow_dispatch) — ติ๊ก dry เพื่อดูข้อความโดยไม่ส่งจริง
name: weekly-digest-line
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      dry:
        description: "ทดสอบอย่างเดียว ไม่ส่งเข้า LINE"
        type: boolean
        default: false
      until:
        description: "วันสุดท้ายของสัปดาห์ที่จะสรุป (YYYY-MM-DD, ว่าง = วันนี้)"
        type: string
        default: ""
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Push digest to LINE
        run: |
          URL="https://dashboard-ads-thanatos.vercel.app/api/digest/line?key=${{ secrets.CRON_SECRET }}"
          # สรุปสัปดาห์ที่จบเมื่อวาน (อาทิตย์) — ไม่เอาวันจันทร์ที่ยังไม่จบมาปน
          UNTIL="${{ inputs.until }}"
          [ -z "$UNTIL" ] && UNTIL=$(date -u -d "yesterday" +%Y-%m-%d)
          URL="$URL&until=$UNTIL"
          [ "${{ inputs.dry }}" = "true" ] && URL="$URL&dry=1"
          echo "→ until=$UNTIL dry=${{ inputs.dry }}"
          BODY=$(curl -sS --max-time 115 -w "\n%{http_code}" "$URL")
          CODE=$(echo "$BODY" | tail -1)
          echo "$BODY" | head -c 4000
          echo ""
          [ "$CODE" = "200" ] || { echo "::error::digest→LINE ล้มเหลว (HTTP $CODE)"; exit 1; }
